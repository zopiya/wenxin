{{ define "title" }}{{ .Title }} | {{ .Site.Params.author | default .Site.Title }}{{ end }}

{{ define "sidebar" }}
  <aside class="sidebar" data-hugo-partial="sidebar">
    {{ partial "sidebar.html" . }}
  </aside>
{{ end }}

{{ define "main" }}
<main class="about-wrapper" id="main-content" tabindex="-1">

  <section class="hero-section">
    <h2 class="hero-title">{{ .Title }}</h2>
    <section class="narrative-text">
      {{ .Content }}
    </section>
  </section>

</main>
{{ end }}
